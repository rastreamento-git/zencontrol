services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zencontrol
      POSTGRES_USER: zencontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup primeiro}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zencontrol -d zencontrol"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      ZEN_RUN_WORKER: "false"
      DATABASE_URL: postgres://zencontrol:${POSTGRES_PASSWORD}@db:5432/zencontrol
      DATABASE_SSL: disable
    command: ["sh", "-c", "npm run migrate && npm start"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zencontrol:${POSTGRES_PASSWORD}@db:5432/zencontrol
      DATABASE_SSL: disable
    command: ["npm", "run", "worker"]
    volumes:
      - media:/app/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
  media:
